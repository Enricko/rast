<!doctype html>
<!--
  RAST web shell. scripts/web-build.sh resolves the bootstrap URL to the
  matching release. Rune renders the app in one canvas using WebGPU.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>RAST</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    background: #101014;
  }
  #status {
    font: 16px system-ui, sans-serif;
    color: #c9c9d1;
    padding: 24px;
  }
</style>
</head>
<body>
<div id="status">Loading RAST…</div>
<script type="module" src="./boot.js"></script>
</body>
</html>

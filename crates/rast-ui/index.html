<!doctype html>
<!--
  RAST web shell. Committed by hand; scripts/web-build.sh copies it next to the
  wasm-bindgen output (app.js, app_bg.wasm). The page needs WebGPU: Rune's web
  target renders one canvas through it, with no WebGL fallback.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>RAST</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    background: #101014;
  }
  #status {
    font: 16px system-ui, sans-serif;
    color: #c9c9d1;
    padding: 24px;
  }
</style>
</head>
<body>
<div id="status">Loading RAST…</div>
<script type="module">
  import init from './app.js';
  try {
    if (!navigator.gpu) {
      throw new Error('RAST needs a browser with WebGPU (Chrome/Edge 113+, Safari 26+, Firefox with WebGPU enabled) over HTTPS.');
    }
    await init();
    document.querySelector('#status').remove();
  } catch (error) {
    document.querySelector('#status').textContent = String(error);
    console.error(error);
  }
</script>
</body>
</html>

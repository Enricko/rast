# Trunk configuration for rast-ui (Trunk 0.22).
[build]
target = "index.html"
dist = "dist"
# Everything is served under /ui/ by rast-server (crates/rast-server/src/server.rs).
public_url = "/ui/"
# Stable names (rast-ui.js, rast-ui_bg.wasm) so the TypeScript loader can find
# the glue without a manifest. Cache-busting comes from ETag revalidation.
filehash = false

[tools]
# Trunk downloads wasm-bindgen and wasm-opt into its user cache; the
# wasm-bindgen version must match the `wasm-bindgen` crate in Cargo.lock.

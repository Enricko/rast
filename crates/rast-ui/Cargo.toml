[package]
name = "rast-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "RAST web UI written in Leptos (Rust compiled to WebAssembly), mounted into RAST windows."

# `cdylib` is what wasm-bindgen consumes; `rlib` keeps `cargo clippy/test
# --workspace` working on the native host. Build the real artefact with
# `scripts/build-ui.sh` (Trunk, target wasm32-unknown-unknown).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos.workspace = true
wasm-bindgen.workspace = true
web-sys.workspace = true
console_error_panic_hook.workspace = true

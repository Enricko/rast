[package]
name = "rast-ui"
description = "RAST desktop shell — the Rune-rendered UI of the RAST Linux web desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# One crate, two targets: a native window binary and a wasm cdylib for the
# browser (Rune's experimental WebGPU web target). The HTML login calls the
# exported browser bridge; Rune starts only after the device is unlocked.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rast"
path = "src/main.rs"

[features]
# Headless `--snap`, `--tree` and `--script` runs in *release* builds. Debug
# builds always have them; this feature is for CI and agent proof runs of the
# release binary. See crates/rune/README.md, "Agent tooling".
agent-tooling = ["rune/tooling"]

[dependencies]
rune = { workspace = true }
# Device-local login: Argon2id password hashing (never a plaintext password).
# Pure Rust, so it runs natively and in the browser.
argon2 = "0.5"
# The RAST server's JSON account API.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
# Web Crypto for the salt, and localStorage for the per-browser device account.
getrandom = { version = "0.2", features = ["js"] }
# Navigator, Screen and the online/offline events for the taskbar's device and
# network status; js-sys reads `navigator.connection` and the time zone.
js-sys = "0.3"
# Same-origin fetch to the RAST server's /api (the session is an HttpOnly cookie).
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "Event", "EventTarget", "Navigator", "Screen", "Headers", "Request", "RequestInit", "Response"] }

[lints]
workspace = true

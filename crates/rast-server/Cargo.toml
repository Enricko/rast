[package]
name = "rast-server"
description = "RAST server: accounts, roles and sessions behind the Rune desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs"] }
# SQLite, bundled; plain runtime queries (no compile-time checked macros).
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
# Same Argon2id parameters as the client's device login.
argon2 = "0.5"
getrandom = "0.2"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true

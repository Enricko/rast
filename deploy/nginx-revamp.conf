# Serve the new RAST client shell at https://desktop.lufria.tech/revamp/
# WITHOUT touching the running RAST desktop at /.
#
# Install (as root, on the host that runs nginx):
#   sudo cp deploy/nginx-revamp.conf /etc/nginx/snippets/revamp.conf
#   sudo mkdir -p /srv/rast-static/revamp
#   sudo cp -r dist/web/. /srv/rast-static/revamp/
#   # add one include inside the `server { ... }` block of
#   # /etc/nginx/sites-available/rast, before `location / {`:
#   #     include /etc/nginx/snippets/revamp.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Remove by deleting the include line, then `sudo nginx -t && sudo systemctl reload nginx`.
location = /revamp {
    return 301 /revamp/;
}

location /revamp/ {
    alias /srv/rast-static/revamp/;
    index index.html;
    # The page is a single canvas app; every unknown path under /revamp/ is the page.
    try_files $uri $uri/ /revamp/index.html;

    types {
        application/wasm wasm;
    }
    default_type application/octet-stream;

    # Rune's web build has no inline scripts; keep RAST's CSP tight but allow wasm.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# desktop-revamp.lufria.tech — the new RAST client shell (static WASM build)
# and its account API.
#
# Cloudflare Tunnel terminates TLS and forwards this hostname to 127.0.0.1:8722,
# where nginx serves /srv/rast-static/revamp and forwards /api/ to rast-server. The old desktop at
# https://desktop.lufria.tech/ is a different server block and is not touched.
#
# Install: see deploy/install-revamp.sh (or copy this file to
# /etc/nginx/sites-available/revamp and symlink it into sites-enabled).

server {
    listen 127.0.0.1:8722;
    server_name desktop-revamp.lufria.tech;

    root /srv/rast-static/revamp;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types application/wasm application/javascript text/css text/plain;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # wasm-bindgen's glue imports the module; nginx has no wasm type in mime.types.
    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }

    # The account API: rast-server (deploy/rast-revamp.service) on loopback.
    location /api/ {
        proxy_pass http://127.0.0.1:8723;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Requests reach this port only through the tunnel, so CF-Connecting-IP
        # is Cloudflare's view of the visitor. The server throttles sign-in by it.
        proxy_set_header X-Client-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For "";
        client_max_body_size 16k;
        proxy_read_timeout 30s;
    }

    # One canvas app: every unknown path is the page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

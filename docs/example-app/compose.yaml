# RAST example application (tiny, safe to run anywhere).
#
# Deploy through the Applications UI or with POST /api/apps:
#   {"name": "Hello RAST", "compose": "<contents of this file>",
#    "env": [{"key": "MESSAGE", "value": "hello from RAST", "secret": false}]}
#
# Notes
# * Only prebuilt images are allowed (no `build:` sections).
# * Bind mounts must stay inside the managed app directory: `./data/...` is
#   resolved to <data_dir>/apps/<slug>/data and is therefore accepted, any
#   absolute host path such as `/etc` is rejected by the worker.
# * The service is stateless; named volumes are created and owned by the
#   Compose project (removed only when deleting with removeVolumes=true).

services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./data/html:/usr/share/nginx/html:ro
      - ./data/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - MESSAGE=${MESSAGE}

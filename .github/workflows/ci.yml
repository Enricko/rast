name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Installer, maintenance scripts and workflow YAML
  # ---------------------------------------------------------------------------
  packaging:
    name: Installer, scripts and YAML
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck dash
          python3 -m pip install --user yamllint

      - name: Shell syntax checks
        run: |
          for f in installer/*.sh; do
            sh -n "$f"
            dash -n "$f"
          done
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      - name: ShellCheck (installers, POSIX sh)
        run: shellcheck -s sh -x installer/install.sh installer/uninstall.sh

      - name: ShellCheck (maintenance scripts, bash)
        run: shellcheck -s bash -x scripts/*.sh

      - name: Installer help and safe-path smoke tests
        run: |
          sh installer/install.sh --help > /dev/null
          sh installer/uninstall.sh --help > /dev/null
          # The installer must work when piped to sh and still parse arguments.
          # shellcheck disable=SC2002 # piping through cat is exactly what we test here
          cat installer/install.sh | sh -s -- --help > /dev/null
          # Invalid input must fail cleanly before doing anything (no root, no network).
          if RAST_VERSION=not-a-version sh installer/install.sh --dry-run > /dev/null 2>&1; then
            echo "expected an invalid version to be rejected" >&2
            exit 1
          fi

      - name: Embedded deploy assets are in sync
        run: scripts/sync-installer-assets.sh --check

      - name: YAML lint
        run: python3 -m yamllint -c .github/yamllint.yml .github/workflows

      - name: Third-party license inventory is up to date
        run: scripts/generate-third-party-licenses.sh --check

  # ---------------------------------------------------------------------------
  # Frontend: Node.js + npm, built once and shared with the binary jobs
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Rust: formatting, lints and tests
  # ---------------------------------------------------------------------------
  rust:
    name: Rust lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ steps.toolchain.outputs.channel }}" \
            --profile minimal --component rustfmt --component clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --all-targets

  # ---------------------------------------------------------------------------
  # Release-profile builds on native runners (arm64 is a real arm runner,
  # never a cross-compile — see docs/COMPATIBILITY.md)
  # ---------------------------------------------------------------------------
  build:
    name: Release build (${{ matrix.arch }})
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ steps.toolchain.outputs.channel }}" \
            --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test
        run: |
          test -f frontend/dist/index.html
          ./target/release/rast version

      - name: Stage release asset
        run: |
          cp target/release/rast "rast-linux-${{ matrix.arch }}"
          chmod 0755 "rast-linux-${{ matrix.arch }}"
          sha256sum "rast-linux-${{ matrix.arch }}" > "rast-linux-${{ matrix.arch }}.sha256"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: rast-linux-${{ matrix.arch }}
          path: |
            rast-linux-${{ matrix.arch }}
            rast-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # macOS (Apple Silicon): lint, tests, a release build and a real start through
  # scripts/run-local.sh (first-run setup token, setup, login). The runner has
  # no Docker engine, so this also covers "Docker off".
  # ---------------------------------------------------------------------------
  macos:
    name: macOS build and tests (arm64)
    needs: frontend
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ steps.toolchain.outputs.channel }}" \
            --profile minimal --component clippy

      - uses: Swatinem/rust-cache@v2

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --release --locked

      - name: Start RAST with scripts/run-local.sh
        run: |
          set -euo pipefail
          ./target/release/rast version
          work=$(mktemp -d)
          pid=""
          cleanup() {
            if [ -n "$pid" ]; then kill -INT "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi
            cat "$work/out.log" || true
            rm -rf "$work"
          }
          trap cleanup EXIT
          RAST_LOCAL_DIR="$work/local" RAST_PORT=18720 scripts/run-local.sh >"$work/out.log" 2>&1 &
          pid=$!
          healthy=no
          for _ in $(seq 1 80); do
            if curl -fsS --max-time 2 http://127.0.0.1:18720/healthz >/dev/null 2>&1; then
              healthy=yes
              break
            fi
            sleep 0.25
          done
          test "$healthy" = yes
          token=$(grep -o 'rast_setup_[0-9a-f]*' "$work/out.log" | head -n 1)
          test -n "$token"
          origin=http://127.0.0.1:18720
          setup_code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H "Origin: $origin" \
            -d "{\"token\":\"$token\",\"username\":\"smoke\",\"password\":\"Runtime-Smoke-Passw0rd-1!\"}" \
            "$origin/api/setup")
          test "$setup_code" = 200
          login_code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H "Origin: $origin" \
            -d '{"username":"smoke","password":"Runtime-Smoke-Passw0rd-1!"}' \
            "$origin/api/auth/login")
          test "$login_code" = 200
          grep -q 'Docker app stays off' "$work/out.log"
          echo "RAST started, was set up and accepted a login on macOS"

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: rast-macos-aarch64
          path: target/release/rast
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Security: secret scanning and dependency auditing
  # ---------------------------------------------------------------------------
  security:
    name: Secrets and dependency audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        # Fail loudly on new advisories. One advisory is explicitly ignored
        # because it cannot be fixed yet: RUSTSEC-2026-0459 (libsqlite3-sys
        # 0.37.0 bundles SQLite with CVE-2026-119375, an information-disclosure
        # issue in WAL handling). sqlx 0.9.0 constrains libsqlite3-sys to
        # <0.38.0, so the patched >=0.39.0 is not yet usable; remove this
        # --ignore as soon as a compatible sqlx release is available.
        run: |
          echo "::warning title=cargo audit::Known advisory RUSTSEC-2026-0459 ignored pending a sqlx release compatible with libsqlite3-sys >= 0.39.0"
          cargo audit --ignore RUSTSEC-2026-0459

      - name: Duplicate dependency survey (informational)
        run: cargo tree -d || true

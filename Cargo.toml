[package]
name = "rast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "RAST — Resource Administration & Storage Toolkit"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["self-hosted", "server", "storage", "admin", "axum"]
categories = ["web-programming::http-server", "command-line-utilities"]

[[bin]]
name = "rast"
path = "src/main.rs"

[lib]
name = "rast"
path = "src/lib.rs"

[workspace]
members = [".", "crates/rast-ui", "crates/rast-api", "crates/rast-server", "crates/rast-session", "crates/rast-agent", "crates/rast-helper", "crates/rast-docker", "crates/rast-apps", "crates/rast-base"]
# Plain `cargo build/clippy/test` at the root covers every crate that compiles
# natively, so each of those is listed in both places. Only wasm-only crates
# (such as `rast-ui`, which only runs as WebAssembly) go in `members` only.
default-members = [".", "crates/rast-api", "crates/rast-server", "crates/rast-session", "crates/rast-agent", "crates/rast-helper", "crates/rast-docker", "crates/rast-apps", "crates/rast-base"]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/Enricko/rast"
homepage = "https://github.com/Enricko/rast"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "signal", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "request-id"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }
argon2 = "0.6.0"
rand = "0.9"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
subtle = "2"
base64 = "0.22"
hex = "0.4"
aes-gcm = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
clap = { version = "4.6", features = ["derive", "env"] }
sysinfo = "0.40"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
mime_guess = "2"
percent-encoding = "2"
rust-embed = { version = "8", features = ["include-exclude"] }
ipnet = "2"
walkdir = "2"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
flate2 = "1"
tar = "0.4"
xz2 = "0.1"
bzip2 = "0.6"
ureq = { version = "3", default-features = false, features = ["rustls"] }
ring = "0.17"
async-trait = "0.1"
socket2 = "0.6"
libc = "0.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
notify = "8.2.2"
httparse = "1.10"
tokio-tungstenite = "0.29"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
tempfile = "3"
http-body-util = "0.1"
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlElement"] }
console_error_panic_hook = "0.1"

[dependencies]
rast-server = { path = "crates/rast-server" }
rast-session = { path = "crates/rast-session" }
rast-agent = { path = "crates/rast-agent" }
rast-helper = { path = "crates/rast-helper" }
rast-docker = { path = "crates/rast-docker" }
rast-apps = { path = "crates/rast-apps" }
rast-base = { path = "crates/rast-base" }
axum.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
sqlx.workspace = true
argon2.workspace = true
rand.workspace = true
sha2.workspace = true
sha1.workspace = true
hmac.workspace = true
subtle.workspace = true
base64.workspace = true
hex.workspace = true
aes-gcm.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
clap.workspace = true
sysinfo.workspace = true
uuid.workspace = true
futures.workspace = true
tokio-stream.workspace = true
mime_guess.workspace = true
percent-encoding.workspace = true
rust-embed.workspace = true
ipnet.workspace = true
walkdir.workspace = true
hyper.workspace = true
hyper-util.workspace = true
flate2.workspace = true
tar.workspace = true
xz2.workspace = true
bzip2.workspace = true
ureq.workspace = true
ring.workspace = true
async-trait.workspace = true
socket2.workspace = true
libc.workspace = true
chrono.workspace = true
notify.workspace = true
httparse.workspace = true
tokio-tungstenite.workspace = true
zip.workspace = true

[dev-dependencies]
rast-session = { path = "crates/rast-session", features = ["test-support"] }
rast-base = { path = "crates/rast-base", features = ["test-support"] }
tempfile.workspace = true
http-body-util.workspace = true
sqlx.workspace = true

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Used only for the WebAssembly bundle (`scripts/build-ui.sh`, Trunk).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 1

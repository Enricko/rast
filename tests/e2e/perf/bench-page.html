<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RAST bench</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #10131a; color: #e6e9f0; font-family: system-ui, sans-serif; }
  #topstrip { position: fixed; top: 0; left: 0; right: 0; height: 8px; background: #000; z-index: 51; }
  #nav { position: fixed; top: 8px; left: 0; right: 0; height: 64px; display: flex; z-index: 50; }
  #nav button { flex: 1; font: 700 22px/64px system-ui, sans-serif; border: 0; color: #fff; cursor: pointer; }
  #nav button[data-mode=type] { background: #b3261e; }
  #nav button[data-mode=scroll] { background: #1e5fb3; }
  #nav button[data-mode=anim] { background: #2b8a4a; }
  #nav button[data-mode=video] { background: #8a6d1e; }
  #nav button.current { outline: 6px solid #fff; outline-offset: -6px; }
  #swatch { position: fixed; top: 84px; left: 8px; width: 220px; height: 120px; background: #223; border: 2px solid #556; z-index: 10; }
  #count { position: fixed; top: 80px; left: 240px; font: 700 64px/120px monospace; color: #fff; z-index: 10; }
  #status { position: fixed; top: 210px; left: 8px; height: 22px; background: #2a2; width: 0; z-index: 10; }
  textarea { position: fixed; top: 246px; left: 8px; width: 660px; height: 120px; font: 26px/1.3 monospace;
             background: #0b0d12; color: #e6e9f0; border: 2px solid #445; caret-color: transparent; resize: none; }
  .band { height: 120px; }
  #scrollbar { position: fixed; right: 0; top: 0; width: 18px; background: #f80; z-index: 60; }
  #anim, #video { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 40; }
  #popup { position: fixed; right: 12px; bottom: 12px; width: 220px; height: 56px; z-index: 70;
           font: 700 20px/56px system-ui, sans-serif; background: #d33; color: #fff; border: 2px solid #fff; cursor: pointer; }
</style>
</head>
<body>
<div id="topstrip"></div>
<div id="nav">
  <button data-mode="type">TYPE</button>
  <button data-mode="scroll">SCROLL</button>
  <button data-mode="anim">ANIM</button>
  <button data-mode="video">VIDEO</button>
</div>
<canvas id="swatch" width="220" height="120"></canvas>
<div id="count">0</div>
<div id="status"></div>
<div id="scrollbar" style="height:0"></div>
<button id="popup" type="button">OPEN POPUP</button>
<div class="bands"></div>
<textarea id="ta" autofocus spellcheck="false"></textarea>
<script>
  const params = new URLSearchParams(location.search);
  const mode = params.get("mode") || "type";
  const swatch = document.getElementById("swatch");
  const ctx = swatch.getContext("2d");
  const countEl = document.getElementById("count");
  const ta = document.getElementById("ta");
  let count = 0;
  // Deterministic paint: every key changes the whole page background plus a large
  // swatch whose colour is a pure function of the key counter. No other animation
  // exists in type mode, so any new compositor frame means "the key reached the
  // display".
  function paint() {
    const hue = (count * 47) % 360;
    ctx.fillStyle = `hsl(${hue} 90% 50%)`;
    ctx.fillRect(0, 0, 220, 120);
    countEl.textContent = String(count);
    document.documentElement.style.background = `hsl(${(count * 61) % 360} 35% 22%)`;
    document.body.style.background = `hsl(${(count * 61) % 360} 35% 22%)`;
  }
  paint();
  addEventListener("keydown", (event) => {
    count += 1;
    if (!event.ctrlKey && !event.altKey && !event.metaKey && (event.key === "p" || event.key === "P")) openPopup();
    requestAnimationFrame(paint);
  }, true);
  ta.addEventListener("input", () => {
    document.getElementById("status").style.width = Math.min(100, (ta.value.length / 40) * 100) + "%";
  });
  for (const button of document.querySelectorAll("#nav button")) {
    button.classList.toggle("current", button.dataset.mode === mode);
    button.addEventListener("click", () => { location.search = `?mode=${button.dataset.mode}`; });
  }
  if (mode === "scroll") {
    const bands = document.querySelector(".bands");
    let html = "";
    for (let i = 0; i < 120; i += 1) html += `<div class="band" style="background:hsl(${(i * 3) % 360} 60% 35%)"></div>`;
    bands.innerHTML = html;
    document.body.style.height = "14400px";
    const bar = document.getElementById("scrollbar");
    const sync = () => {
      const max = Math.max(1, document.body.scrollHeight - innerHeight);
      bar.style.height = `${Math.round((scrollY / max) * innerHeight)}px`;
    };
    addEventListener("scroll", sync, { passive: true });
    sync();
  }
  if (mode === "anim") {
    const canvas = document.createElement("canvas");
    canvas.id = "anim";
    canvas.width = 1280;
    canvas.height = 720;
    document.body.appendChild(canvas);
    const actx = canvas.getContext("2d");
    let frame = 0;
    function draw() {
      frame += 1;
      actx.fillStyle = `hsl(${(frame * 7) % 360} 70% 45%)`;
      actx.fillRect(0, 0, 1280, 720);
      actx.fillStyle = "#fff";
      actx.font = "bold 96px monospace";
      actx.fillText(String(frame), 80, 200);
      actx.fillRect(80 + ((frame * 7) % 1000), 400, 120, 120);
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  }
  if (mode === "video") {
    const video = document.createElement("video");
    video.id = "video";
    video.src = params.get("src") || "/fixture.webm";
    video.autoplay = true;
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    document.body.appendChild(video);
  }
  let popupOpens = 0;
  function openPopup() {
    popupOpens += 1;
    // Visible marker: proves the request reached the page even if the popup is
    // blocked, so the harness can distinguish "input not delivered" from
    // "window.open blocked".
    document.getElementById("popup").textContent = "POPUP " + popupOpens;
    document.body.style.filter = popupOpens % 2 ? "brightness(1.4)" : "none";
    window.open("/?mode=type&popup=1", "rast-bench-popup", "width=760,height=520,menubar=no,toolbar=no");
  }
  document.getElementById("popup").addEventListener("click", openPopup);
  window.__bench = { ready: true, mode };
</script>
</body>
</html>
